name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  OPENWD_NUM_THREADS: "1"

jobs:
  unit-and-component:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Verify repository-local import
        run: python -c "import pathlib, wd_spectra; assert pathlib.Path(wd_spectra.__file__).resolve().is_relative_to(pathlib.Path('src').resolve())"
      - name: Verify compiled acceleration backend
        run: python -c "from wd_spectra import _rt; assert hasattr(_rt, 'hydrogen_stark_lorentz_convolution')"
      - run: python -m pytest

  cool-workflow-components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test,research]'
      - name: Check opt-in workflows without external research data
        env:
          PYTHONPATH: src:research/cool_models
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OPENWD_NUM_THREADS: "1"
        run: python -m pytest research/cool_models -o addopts=-ra
